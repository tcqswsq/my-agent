<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 企业知识库系统</title>
<style>
/* ========== CSS 变量 & 基础样式 ========== */
:root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --primary-bg: #eef2ff;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --success: #16a34a;
    --danger: #dc2626;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* ========== 顶部栏 ========== */
.header {
    background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(79,70,229,.25);
    position: sticky; top:0; z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
.header .status {
    font-size: 12px;
    display:flex; align-items:center; gap:6px;
}
.header .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #fbbf24;
    display: inline-block; animation: pulse 1.5s infinite;
}
.header .dot.online { background: #4ade80; animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ========== 布局 ========== */
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
}

/* ========== Tab 导航 ========== */
.tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin: 20px 0;
    padding: 4px;
}
.tab-btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.tab-btn:hover { color: var(--text); background: var(--bg); }
.tab-btn.active { background: var(--primary); color: #fff; }
.tab-btn .icon { font-size: 18px; }

/* ========== 面板 ========== */
.panel { display: none; }
.panel.active { display: block; }

/* ========== 卡片 ========== */
.card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}

/* ========== 聊天区 ========== */
.chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 220px);
    min-height: 450px;
}
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.chat-messages .empty {
    text-align: center;
    color: var(--text-muted);
    margin-top: 80px;
    font-size: 14px;
}
.chat-messages .empty .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }

.msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: fadeIn .3s;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }

.msg .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    flex-shrink: 0;
}
.msg.user .avatar { background: var(--primary); color:#fff; }
.msg.ai .avatar { background: #e0e7ff; color: var(--primary); }

.msg .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
}
.msg.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai .bubble { background: #f1f5f9; color: var(--text); border-bottom-left-radius: 4px; }
.msg.ai .bubble .context-label {
    font-size: 11px; color: var(--text-muted);
    margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}
.msg.ai .bubble .tool-call {
    font-size: 12px; color: #6366f1; background: #eef2ff;
    padding: 4px 8px; margin-bottom: 4px; border-radius: 6px;
    border-left: 3px solid #6366f1;
}
.msg.ai .bubble .tool-result {
    font-size: 11px; padding: 3px 8px; margin-bottom: 4px; border-radius: 4px;
}
.msg.ai .bubble .tool-result.ok { color: #16a34a; background: #f0fdf4; }
.msg.ai .bubble .tool-result.fail { color: #dc2626; background: #fef2f2; }

.chat-input-area {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.chat-input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
}
.chat-input-area input:focus { border-color: var(--primary); }
.chat-input-area button {
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    transition: background .2s;
}
.chat-input-area button:hover { background: var(--primary-light); }
.chat-input-area button:disabled { opacity: .6; cursor: not-allowed; }

/* ========== 表单 ========== */
.form-group { margin-bottom: 16px; }
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
}
.form-group label .hint { color: var(--text-muted); font-weight: 400; font-size: 12px; }

.form-group input, .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
}
.form-group input:focus { border-color: var(--primary); }

/* 拖拽上传区 */
.drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    color: var(--text-muted);
}
.drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--primary);
    background: var(--primary-bg);
    color: var(--primary);
}
.drop-zone .dz-icon { font-size: 36px; margin-bottom: 8px; }
.drop-zone .dz-text { font-size: 14px; }
.drop-zone .dz-hint { font-size: 12px; margin-top: 4px; }
.drop-zone input[type=file] { display: none; }

/* ========== 按钮 ========== */
.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.btn-outline:hover { background: var(--primary-bg); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .85; }

/* ========== 表格 ========== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
td { padding: 12px; border-bottom: 1px solid var(--border); }
tr:hover { background: #fafbff; }
.file-id { font-family: monospace; font-size: 11px; color: var(--text-muted); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }

/* ========== 提示信息 ========== */
.toast {
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
    animation: slideIn .3s;
}
@keyframes slideIn { from{opacity:0;transform:translateX(-12px)} }
.toast.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.toast.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.toast.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

/* ========== 弹窗 ========== */
.modal-overlay {
    display: none;
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,.4);
    z-index: 200;
    align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    max-height: 80vh;
    overflow-y: auto;
}
.modal h3 { margin-bottom: 16px; font-size: 16px; }
.modal .close-btn {
    float: right; background: none; border: none;
    font-size: 20px; cursor: pointer; color: var(--text-muted);
}

/* ========== 搜索框 ========== */
.search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
}
.search-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}
.search-bar input:focus { border-color: var(--primary); }

/* ========== 响应式 ========== */
@media (max-width: 640px) {
    .header { padding: 0 12px; }
    .header h1 { font-size: 15px; }
    .tabs { gap: 0; }
    .tab-btn { padding: 10px 8px; font-size: 12px; }
    .tab-btn .icon { font-size: 16px; }
    .msg { max-width: 92%; }
}
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<header class="header">
    <h1>📚 RAG 企业知识库</h1>
    <div style="display:flex;align-items:center;gap:16px">
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中...</span>
        </div>
        <button onclick="openSettings()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px" title="设置">⚙️</button>
    </div>
</header>

<div class="container">

<!-- ===== Tab 导航 ===== -->
<nav class="tabs">
    <button class="tab-btn active" data-tab="chat">  <span class="icon">💬</span> 智能问答 </button>
    <button class="tab-btn"        data-tab="upload"><span class="icon">📤</span> 文档入库 </button>
    <button class="tab-btn"        data-tab="manage"><span class="icon">📋</span> 文件管理 </button>
</nav>

<!-- ========== Tab 1: 智能问答 ========== -->
<section class="panel active" id="panel-chat">
    <div class="card chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="empty">
                <span class="big-icon">🤖</span>
                输入问题，我会从知识库中查找答案
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="输入您的问题，如「年假怎么请？」" autofocus
                   onkeydown="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
</section>

<!-- ========== Tab 2: 文档入库 ========== -->
<section class="panel" id="panel-upload">
    <!-- 单文件上传 -->
    <div class="card">
        <h3 style="margin-bottom:16px">📥 单文件入库</h3>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="dz-icon">📎</div>
            <div class="dz-text" id="dzText">点击选择文件 或 拖拽文件到此处</div>
            <div class="dz-hint">支持 PDF / DOCX / TXT / MD / XLSX / CSV / PPTX / HTML / JSON</div>
            <input type="file" id="fileInput" onchange="onFileSelected(this)">
        </div>
        <br>
        <div class="form-group">
            <label>业务编码 <span class="hint">(必填，如 EMP-HB-001)</span></label>
            <input type="text" id="ingestDocCode" placeholder="如 EMP-HB-001（员工手册）、FIN-2026-01（财务制度）">
        </div>
        <div class="form-group">
            <label>上传人</label>
            <input type="text" id="ingestUploader" value="web_user" placeholder="上传人 ID">
        </div>
        <button class="btn btn-primary" onclick="ingestFile()" id="ingestBtn">📤 提交入库</button>
        <div id="ingestResult"></div>
    </div>

    <!-- 批量导入 -->
    <div class="card">
        <h3 style="margin-bottom:16px">📁 批量文件夹导入</h3>
        <div class="form-group">
            <label>文件夹路径</label>
            <input type="text" id="folderPath" placeholder="E:\company_docs\hr\">
        </div>
        <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" id="recursiveCheck" checked> 包含子目录
            </label>
        </div>
        <button class="btn btn-outline" onclick="ingestFolder()">📁 批量导入</button>
        <div id="folderResult"></div>
    </div>

    <!-- 文件更新 -->
    <div class="card">
        <h3 style="margin-bottom:16px">🔄 更新文件（自动归档旧版）</h3>
        <div class="form-group">
            <label>doc_code（要更新的文件业务编码）</label>
            <input type="text" id="updateDocCode" placeholder="如 EMP-HB-001">
        </div>
        <div class="form-group">
            <label>新文件</label>
            <input type="file" id="updateFileInput" style="padding:8px">
        </div>
        <button class="btn btn-outline" onclick="updateFile()">🔄 提交更新</button>
        <div id="updateResult"></div>
    </div>
</section>

<!-- ========== Tab 3: 文件管理 ========== -->
<section class="panel" id="panel-manage">
    <div class="card">
        <div class="search-bar">
            <input type="text" id="fileSearchInput" placeholder="按文件名关键词搜索..."
                   oninput="loadFileList(this.value)">
            <button class="btn btn-outline btn-sm" onclick="loadFileList('')">🔄 刷新</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>文件名</th>
                        <th>业务编码</th>
                        <th>文件 ID</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:32px">
                        加载中...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</div><!-- /.container -->

<!-- ===== 设置弹窗 ===== -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal" style="max-width:520px">
        <button class="close-btn" onclick="closeSettings()">&times;</button>
        <h3>⚙️ 系统设置</h3>
        <div class="form-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="setApiKey" placeholder="sk-xxxxxxxxxxxxxxxx">
            <span style="font-size:11px;color:var(--text-muted)" id="apiKeyHint"></span>
        </div>
        <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="setApiBase" placeholder="https://api.deepseek.com">
        </div>
        <div class="form-group">
            <label>LLM 模型</label>
            <input type="text" id="setLlmModel" placeholder="deepseek-v4-flash">
        </div>
        <div class="form-group">
            <label>Embedding 模型</label>
            <input type="text" id="setEmbedModel" placeholder="deepseek-embedding-base">
        </div>
        <div class="form-group">
            <label>Embedding 模式</label>
            <select id="setEmbedMode">
                <option value="api">API 模式（DeepSeek，无需本地模型）</option>
                <option value="local">本地模式（需要本地模型文件）</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()" style="width:100%">💾 保存设置</button>
        <p style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">
            API Key 保存后立即生效，其他设置需重启服务。
        </p>
        <div id="settingsResult"></div>
    </div>
</div>

<!-- ===== 归档弹窗 ===== -->
<div class="modal-overlay" id="archiveModal">
    <div class="modal">
        <button class="close-btn" onclick="closeArchiveModal()">&times;</button>
        <h3>📦 归档历史</h3>
        <div id="archiveContent">加载中...</div>
    </div>
</div>

<script>
// ============================
// 全局状态
// ============================
let systemReady = false;
let selectedFile = null;

// ============================
// 初始化
// ============================
async function checkStatus() {
    try {
        const r = await fetch('/api/status');
        const s = await r.json();
        systemReady = s.ready;
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        if (s.ready) {
            dot.className = 'dot online';
            txt.textContent = '系统就绪 (' + (s.tools||[]).length + ' 个工具)';
        } else {
            dot.className = 'dot';
            txt.textContent = s.status || '初始化中...';
            setTimeout(checkStatus, 2000);
        }
    } catch(e) {
        setTimeout(checkStatus, 3000);
    }
}
checkStatus();

// ============================
// Tab 切换
// ============================
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'manage') loadFileList();
    });
});

// ============================
// 拖拽上传
// ============================
const dropZone = document.getElementById('dropZone');
if (dropZone) {
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            document.getElementById('fileInput').files = files;
            onFileSelected({files: files});
        }
    });
}

function onFileSelected(input) {
    if (input.files.length > 0) {
        selectedFile = input.files[0];
        document.getElementById('dzText').textContent = '已选择: ' + selectedFile.name;
    }
}

// ============================
// 通用 Toast
// ============================
function showToast(containerId, html, type) {
    const el = document.getElementById(containerId);
    el.innerHTML = `<div class="toast ${type}">${html}</div>`;
}

// ============================
// Tab1: 智能问答
// ============================
async function sendMessage() {
    if (!systemReady) { alert('系统尚未就绪，请稍候...'); return; }

    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    input.value = '';
    input.disabled = true;
    document.getElementById('sendBtn').disabled = true;

    // 清空空状态
    const msgs = document.getElementById('chatMessages');
    const emptyEl = msgs.querySelector('.empty');
    if (emptyEl) emptyEl.remove();

    // 添加用户消息
    addMsg('user', msg);

    // 创建 AI 消息气泡
    const aiBubble = addMsg('ai', '');
    const aiText = aiBubble.querySelector('.ai-text');

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: msg}),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';
        let toolCallsHtml = '';

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                    const data = JSON.parse(line.slice(6));
                    if (data.type === 'token') {
                        fullText += data.text;
                        aiText.innerHTML = toolCallsHtml + fullText;
                        msgs.scrollTop = msgs.scrollHeight;
                    } else if (data.type === 'tool_call') {
                        toolCallsHtml += `<div class="tool-call">🔧 调用: <b>${escapeHtml(data.name)}</b></div>`;
                        aiText.innerHTML = toolCallsHtml + (fullText || '思考中...');
                        msgs.scrollTop = msgs.scrollHeight;
                    } else if (data.type === 'tool_result') {
                        const ok = data.output && !data.output.startsWith('Error') && !data.output.startsWith('❌');
                        const icon = ok ? '✅' : '⚠️';
                        const summary = (data.output || '').slice(0, 100);
                        toolCallsHtml += `<div class="tool-result ${ok ? 'ok' : 'fail'}">${icon} ${escapeHtml(data.name)}: ${escapeHtml(summary)}</div>`;
                        aiText.innerHTML = toolCallsHtml + (fullText || '处理中...');
                        msgs.scrollTop = msgs.scrollHeight;
                    } else if (data.type === 'error') {
                        aiText.innerHTML = toolCallsHtml + '<span style="color:#e74c3c">错误: ' + escapeHtml(data.text) + '</span>';
                    }
                } catch(e) {}
            }
        }

        if (!fullText && aiText.textContent === '') {
            aiText.textContent = '(收到空回复)';
        }

    } catch(e) {
        aiText.textContent = '请求失败: ' + e.message;
    }

    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
    msgs.scrollTop = msgs.scrollHeight;
}

function addMsg(role, text) {
    const msgs = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = role === 'user' ? '👤' : '🤖';
    const label = role === 'user' ? '你' : 'AI';

    div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">
            <span class="ai-text">${escapeHtml(text)}</span>
        </div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.bubble');
}

function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================
// Tab2: 文档入库
// ============================
async function ingestFile() {
    if (!systemReady) { alert('系统尚未就绪'); return; }
    if (!selectedFile) { alert('请先选择文件'); return; }

    const docCode = document.getElementById('ingestDocCode').value.trim();
    if (!docCode) { alert('请输入业务编码 (doc_code)'); return; }

    const btn = document.getElementById('ingestBtn');
    btn.disabled = true; btn.textContent = '上传中...';

    const form = new FormData();
    form.append('file', selectedFile);
    form.append('doc_code', docCode);
    form.append('uploader_id', document.getElementById('ingestUploader').value.trim() || 'web_user');

    try {
        const r = await fetch('/api/ingest', {method:'POST', body:form});
        const data = await r.json();
        const type = data.success ? 'success' : 'error';
        showToast('ingestResult', data.message, type);

        if (data.success) {
            // 清空选择
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('dzText').textContent = '点击选择文件 或 拖拽文件到此处';
        }
    } catch(e) {
        showToast('ingestResult', '网络错误: ' + e.message, 'error');
    }
    btn.disabled = false; btn.textContent = '📤 提交入库';
}

async function ingestFolder() {
    if (!systemReady) { alert('系统尚未就绪'); return; }
    const path = document.getElementById('folderPath').value.trim();
    if (!path) { alert('请输入文件夹路径'); return; }

    try {
        const r = await fetch('/api/ingest-folder', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                folder_path: path,
                recursive: document.getElementById('recursiveCheck').checked,
            }),
        });
        const data = await r.json();
        showToast('folderResult', data.message, data.success ? 'success' : 'error');
    } catch(e) {
        showToast('folderResult', '请求失败: ' + e.message, 'error');
    }
}

async function updateFile() {
    if (!systemReady) { alert('系统尚未就绪'); return; }

    const docCode = document.getElementById('updateDocCode').value.trim();
    if (!docCode) { alert('请输入 doc_code'); return; }

    const fileInput = document.getElementById('updateFileInput');
    if (!fileInput.files.length) { alert('请选择新文件'); return; }

    const form = new FormData();
    form.append('file', fileInput.files[0]);
    form.append('doc_code', docCode);

    try {
        const r = await fetch('/api/update', {method:'POST', body:form});
        const data = await r.json();
        showToast('updateResult', data.message, data.success ? 'success' : 'error');

        if (data.success) {
            fileInput.value = '';
            document.getElementById('updateDocCode').value = '';
        }
    } catch(e) {
        showToast('updateResult', '请求失败: ' + e.message, 'error');
    }
}

// ============================
// Tab3: 文件管理
// ============================
async function loadFileList(keyword) {
    keyword = keyword || document.getElementById('fileSearchInput')?.value || '';
    try {
        const r = await fetch('/api/files?keyword=' + encodeURIComponent(keyword));
        const data = await r.json();

        const tbody = document.getElementById('fileTableBody');
        if (!data.files || data.files.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:32px">
                知识库为空，请先上传文档
            </td></tr>`;
            return;
        }

        tbody.innerHTML = data.files.map(f => `
            <tr>
                <td><strong>${escapeHtml(f.original_filename || '未知')}</strong></td>
                <td>${escapeHtml(f.doc_code || '-')}</td>
                <td><span class="file-id">${escapeHtml(f.file_id || f.id || '-')}</span></td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="viewArchive('${escapeHtml(f.file_id || f.id)}')">📦 归档</button>
                </td>
            </tr>
        `).join('');

    } catch(e) {
        document.getElementById('fileTableBody').innerHTML =
            `<tr><td colspan="4" style="text-align:center;color:var(--danger);padding:32px">加载失败: ${e.message}</td></tr>`;
    }
}

async function viewArchive(fileId) {
    const modal = document.getElementById('archiveModal');
    const content = document.getElementById('archiveContent');
    modal.classList.add('show');
    content.innerHTML = '加载中...';

    try {
        const r = await fetch('/api/archive/' + fileId);
        const data = await r.json();
        if (data.versions && data.versions.length > 0) {
            content.innerHTML = '<ul style="padding-left:20px;line-height:2">' +
                data.versions.map(v => '<li>📄 ' + escapeHtml(v) + '</li>').join('') +
                '</ul>';
        } else {
            content.innerHTML = '<p style="color:var(--text-muted)">无归档版本</p>';
        }
    } catch(e) {
        content.innerHTML = '<p style="color:var(--danger)">加载失败: ' + e.message + '</p>';
    }
}

function closeArchiveModal() {
    document.getElementById('archiveModal').classList.remove('show');
}

// 点击遮罩关闭
document.getElementById('archiveModal').addEventListener('click', function(e) {
    if (e.target === this) closeArchiveModal();
});

// ============================
// 设置
// ============================
async function openSettings() {
    document.getElementById('settingsModal').classList.add('show');
    document.getElementById('settingsResult').innerHTML = '';
    try {
        const r = await fetch('/api/settings');
        const data = await r.json();
        if (data.success) {
            const s = data.settings;
            document.getElementById('setApiKey').value = s.api_key || '';
            document.getElementById('setApiBase').value = s.api_base || 'https://api.deepseek.com';
            document.getElementById('setLlmModel').value = s.llm_model || 'deepseek-v4-flash';
            document.getElementById('setEmbedModel').value = s.embed_model || 'deepseek-embedding-base';
            document.getElementById('setEmbedMode').value = s.embed_mode || 'api';
            if (s.api_key_masked) {
                document.getElementById('apiKeyHint').textContent = '当前: ' + s.api_key_masked;
            }
        }
    } catch(e) {}
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('show');
}

async function saveSettings() {
    const body = {
        api_key: document.getElementById('setApiKey').value.trim(),
        api_base: document.getElementById('setApiBase').value.trim(),
        llm_model: document.getElementById('setLlmModel').value.trim(),
        embed_model: document.getElementById('setEmbedModel').value.trim(),
        embed_mode: document.getElementById('setEmbedMode').value,
    };
    try {
        const r = await fetch('/api/settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        const data = await r.json();
        document.getElementById('settingsResult').innerHTML =
            `<div class="toast ${data.success ? 'success' : 'error'}">${data.message}</div>`;
        if (data.success) {
            document.getElementById('apiKeyHint').textContent =
                '当前: ' + (body.api_key ? body.api_key.slice(0,4) + '****' + body.api_key.slice(-4) : '未设置');
        }
    } catch(e) {
        document.getElementById('settingsResult').innerHTML =
            `<div class="toast error">保存失败: ${e.message}</div>`;
    }
}

// 点击遮罩关闭设置
document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

// 初始加载文件列表（切换到管理 Tab 时）
</script>
